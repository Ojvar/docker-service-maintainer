<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Service Maintainer · Backups</title>
<style>
:root{--bg:#0f1220;--panel:#171b2e;--panel2:#1f2440;--text:#e6e8f2;--muted:#8d93b0;--border:#2a3052;--accent:#7c5cff;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--unk:#64748b;--shadow:0 6px 24px rgba(0,0,0,.35)}
[data-theme=light]{--bg:#f4f6fb;--panel:#fff;--panel2:#eef1f8;--text:#1b1f33;--muted:#5f6684;--border:#dde2ef;--shadow:0 6px 24px rgba(30,40,80,.08)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Vazirmatn,"Segoe UI",Tahoma,system-ui,sans-serif;font-size:14px}
header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:16px 24px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;display:flex;gap:8px;align-items:center}
.logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#22d3ee,var(--accent))}
.spacer{flex:1}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
nav.tabs{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
nav.tabs a{padding:6px 12px;color:var(--text)}nav.tabs a:hover{text-decoration:none;background:var(--panel2)}nav.tabs a.on{background:var(--accent);color:#fff}
main{padding:20px 24px;max-width:1400px;margin:auto}
input,select,button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:7px 10px}
button{cursor:pointer}button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{background:var(--bad);border-color:var(--bad);color:#fff}
button.sm{padding:3px 9px;font-size:12px}button:disabled{opacity:.5;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.stat .n{font-size:26px;font-weight:700}.stat .l{color:var(--muted)}.stat .s{color:var(--muted);font-size:12px;margin-top:2px}
.stat.ok .n{color:var(--ok)}.stat.warn .n{color:var(--warn)}.stat.bad .n{color:var(--bad)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.toolbar input[type=search]{flex:1;min-width:200px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--border);white-space:nowrap}
th{color:var(--muted);font-weight:600;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--panel)}
th.nosort{cursor:default}th .arrow{opacity:.6}
tbody tr:hover{background:var(--panel2)}
tr.newest td{background:color-mix(in srgb,var(--ok) 7%,transparent)}
tr.newest td:first-child{box-shadow:inset 3px 0 0 var(--ok)}
[dir=rtl] tr.newest td:first-child{box-shadow:inset -3px 0 0 var(--ok)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.healthy{color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.degraded{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}
.down{color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}
.unknown{color:var(--unk);background:color-mix(in srgb,var(--unk) 18%,transparent)}
.bar{height:6px;width:90px;background:var(--panel2);border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle;margin-inline-start:8px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#22d3ee)}
.muted{color:var(--muted)}.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
td,.stat .n,.stat .s,.modal dd,.modal p{unicode-bidi:plaintext}
.sub{display:block;color:var(--muted);font-size:12px}
.empty{padding:40px;text-align:center;color:var(--muted)}
.alert{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad);border:1px solid var(--bad);padding:10px 14px;border-radius:10px;margin-bottom:14px;display:none}
.notice{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn);border:1px solid var(--warn);padding:10px 14px;border-radius:10px;margin-bottom:14px;display:none}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:12px}
pre{background:var(--panel2);padding:10px;border-radius:8px;overflow:auto;max-height:320px;white-space:pre-wrap;margin:8px 0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--unk);display:inline-block}
.dot.live{background:var(--ok);animation:p 1.5s infinite}@keyframes p{50%{opacity:.3}}
.spin{display:inline-block;width:11px;height:11px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:s .8s linear infinite;vertical-align:-1px}@keyframes s{to{transform:rotate(360deg)}}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
.modal-bg.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:20px}
.modal h2{margin:0 0 6px;font-size:18px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.modal dl{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;margin:12px 0}.modal dt{color:var(--muted)}.modal dd{margin:0;word-break:break-all}
.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field input{width:100%}
.field input.bad{border-color:var(--bad)}.field input.good{border-color:var(--ok)}
.hint{font-size:12px;color:var(--muted)}.hint.bad{color:var(--bad)}
.warnbox{background:color-mix(in srgb,var(--bad) 12%,transparent);border:1px solid color-mix(in srgb,var(--bad) 50%,transparent);border-radius:10px;padding:10px 12px;color:var(--text)}
.warnbox b{color:var(--bad)}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.progress{height:6px;border-radius:4px;background:var(--panel2);overflow:hidden;margin:12px 0}
.progress>i{display:block;height:100%;width:40%;background:linear-gradient(90deg,var(--accent),#22d3ee);animation:slide 1.2s ease-in-out infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
[dir=rtl] .progress>i{animation-direction:reverse}
.history{margin-top:18px}.history h3{margin:0;padding:12px 14px;font-size:14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.toasts{position:fixed;bottom:16px;inset-inline-end:16px;display:flex;flex-direction:column;gap:10px;z-index:20;max-width:min(420px,calc(100% - 32px))}
.toast{background:var(--panel);border:1px solid var(--border);border-inline-start:4px solid var(--ok);border-radius:10px;padding:10px 14px;box-shadow:var(--shadow)}
.toast.err{border-inline-start-color:var(--bad)}.toast pre{max-height:160px;margin:6px 0 0}
.toast .x{float:inline-end;background:none;border:0;padding:0 4px}
@media(max-width:700px){main{padding:12px}header{padding:12px}.hide-sm{display:none}}
</style>
</head>
<body>
<header>
  <h1><span class="logo"></span>Backups</h1>
  <nav class="tabs"><a href="../dashboard">Services</a><a href="dashboard" class="on">Backups</a></nav>
  <span class="muted" id="updated"></span>
  <span class="spacer"></span>
  <input type="password" id="token" placeholder="x-security-token" autocomplete="off" style="width:180px">
  <button id="saveToken" class="primary">Connect</button>
  <label class="muted"><span class="dot" id="liveDot"></span> <input type="checkbox" id="auto"> Auto 60s</label>
  <button id="refresh" title="Refresh">⟳</button>
  <button id="dir" title="Toggle RTL/LTR">⇄</button>
  <button id="theme" title="Toggle theme">◐</button>
</header>
<main>
  <div class="alert" id="alert"></div>
  <div class="notice" id="notice"><span class="spin"></span> A restore is running on the server. New restores are blocked until it finishes.</div>
  <section class="stats" id="stats"></section>
  <section class="toolbar">
    <input type="search" id="q" placeholder="Search backup files… (press /)">
    <select id="fAge"><option value="">Any age</option><option value="1">Last 24 hours</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option></select>
    <select id="pageSize"><option>10</option><option selected>25</option><option>50</option><option>100</option></select>
    <button id="reset">Reset</button>
  </section>
  <section class="panel" id="list"></section>
  <section class="panel history" id="history"></section>
</main>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toasts" id="toasts"></div>
<script>
"use strict";
// Relative to <BASE_PATH>/backups/dashboard, so it works behind a path-stripping proxy.
const API_LIST = "../backups", API_RESTORE = "../backups/restore";
const TOKEN_KEY = "sm.token", LOOK_KEY = "sm.prefs", PREFS_KEY = "sm.backups.prefs", HISTORY_KEY = "sm.backups.history";
const DB_RE = /^[A-Za-z0-9_-]{1,64}$/;
const COLUMNS = [["name", "Backup file"], ["size", "Size"], ["modified", "Modified"]];
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const readJson = (key, fallback) => { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; } };
const look = readJson(LOOK_KEY, {});
const state = Object.assign({ backups: [], running: false, sort: "modified", asc: false, page: 1, lastDb: "qeng_test", timer: null, restoring: null }, readJson(PREFS_KEY, {}), { theme: look.theme || "dark", dir: look.dir || "ltr" });
const savePrefs = () => {
  localStorage.setItem(PREFS_KEY, JSON.stringify({ sort: state.sort, asc: state.asc, lastDb: state.lastDb }));
  localStorage.setItem(LOOK_KEY, JSON.stringify({ ...readJson(LOOK_KEY, {}), theme: state.theme, dir: state.dir }));
};
const token = () => localStorage.getItem(TOKEN_KEY) || "";

const UNITS = ["B", "KB", "MB", "GB", "TB"];
function humanSize(bytes) {
  let n = bytes, i = 0;
  while (n >= 1024 && i < UNITS.length - 1) { n /= 1024; i++; }
  return `${n.toFixed(i === 0 || n >= 100 ? 0 : 1)} ${UNITS[i]}`;
}
const rtf = new Intl.RelativeTimeFormat(undefined, { numeric: "auto" });
function relTime(sec) {
  const diff = sec - Date.now() / 1000, abs = Math.abs(diff);
  const steps = [[60, "second", 1], [3600, "minute", 60], [86400, "hour", 3600], [604800, "day", 86400], [2629800, "week", 604800], [31557600, "month", 2629800], [Infinity, "year", 31557600]];
  const [, unit, div] = steps.find(([limit]) => abs < limit);
  return rtf.format(Math.round(diff / div), unit);
}
const absTime = (sec) => new Date(sec * 1000).toLocaleString();
const fmtDuration = (ms) => { const s = Math.round(ms / 1000); return s < 60 ? `${s}s` : `${Math.floor(s / 60)}m ${s % 60}s`; };

const showError = (msg) => { $("alert").textContent = msg; $("alert").style.display = msg ? "block" : "none"; };
function toast(title, body, ok) {
  const el = document.createElement("div");
  el.className = "toast" + (ok ? "" : " err");
  el.innerHTML = `<button class="x">✕</button><b>${esc(title)}</b>${body ? `<pre class="mono">${esc(body)}</pre>` : ""}`;
  el.querySelector(".x").onclick = () => el.remove();
  $("toasts").appendChild(el);
  setTimeout(() => el.remove(), ok ? 8000 : 20000);
}

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { "x-security-token": token(), ...(opts.headers || {}) } });
  if (res.status === 401) throw new Error("Unauthorized: enter a valid security token.");
  if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
  return res.json();
}

async function load() {
  if (!token()) { showError("Enter your security token and click Connect."); render(); return; }
  $("refresh").innerHTML = '<span class="spin"></span>';
  try {
    const data = await api(API_LIST);
    state.backups = data.backups || [];
    state.running = !!data.restore_running;
    showError("");
    $("updated").textContent = "Updated " + new Date().toLocaleTimeString();
  } catch (e) { showError("Could not list backups: " + e.message); }
  $("refresh").textContent = "⟳";
  render();
}

const newestName = () => state.backups.reduce((best, b) => (!best || b.modified > best.modified ? b : best), null)?.name;
function filtered() {
  const q = $("q").value.trim().toLowerCase(), days = +$("fAge").value, now = Date.now() / 1000;
  return state.backups.filter((b) => (!q || b.name.toLowerCase().includes(q)) && (!days || now - b.modified <= days * 86400));
}
function sorted(list) {
  const k = state.sort, dir = state.asc ? 1 : -1;
  const key = (b) => k === "name" ? b.name.toLowerCase() : b[k];
  return [...list].sort((a, b) => { const x = key(a), y = key(b); return x < y ? -dir : x > y ? dir : 0; });
}

function renderStats() {
  const list = state.backups, total = list.reduce((s, b) => s + b.size, 0);
  const newest = list.length ? list.reduce((a, b) => (b.modified > a.modified ? b : a)) : null;
  const oldest = list.length ? list.reduce((a, b) => (b.modified < a.modified ? b : a)) : null;
  const ageH = newest ? (Date.now() / 1000 - newest.modified) / 3600 : Infinity;
  const fresh = ageH <= 26 ? "ok" : ageH <= 72 ? "warn" : "bad";
  const items = [
    ["Backups", list.length, "", ""],
    ["Total size", humanSize(total), list.length ? `avg ${humanSize(total / list.length)}` : "", ""],
    ["Latest backup", newest ? relTime(newest.modified) : "—", newest ? absTime(newest.modified) : "", newest ? fresh : ""],
    ["Oldest backup", oldest ? relTime(oldest.modified) : "—", oldest ? absTime(oldest.modified) : "", ""],
  ];
  $("stats").innerHTML = items.map(([l, n, s, c]) => `<div class="stat ${c}"><div class="n">${esc(n)}</div><div class="l">${esc(l)}</div><div class="s">${esc(s)}</div></div>`).join("");
}

const restoreBtn = (b) => {
  const busy = state.running || state.restoring;
  const title = !b.restorable ? "File name has unsupported characters" : busy ? "A restore is already running" : "Restore into a database";
  return `<button class="sm" data-restore="${esc(b.name)}" title="${esc(title)}" ${!b.restorable || busy ? "disabled" : ""}>⤺ Restore</button>`;
};

function render() {
  renderStats();
  $("notice").style.display = state.running || state.restoring ? "block" : "none";
  const all = sorted(filtered()), size = +$("pageSize").value, pages = Math.max(1, Math.ceil(all.length / size));
  state.page = Math.min(state.page, pages);
  const rows = all.slice((state.page - 1) * size, state.page * size);
  const max = Math.max(1, ...state.backups.map((b) => b.size)), newest = newestName();
  const head = COLUMNS.map(([k, l]) => `<th data-k="${k}">${l} <span class="arrow">${state.sort === k ? (state.asc ? "▲" : "▼") : ""}</span></th>`).join("");
  const body = rows.map((b) => `<tr class="${b.name === newest ? "newest" : ""}"><td><span class="mono">${esc(b.name)}</span> ${b.name === newest ? '<span class="badge healthy">newest</span>' : ""}</td><td>${esc(humanSize(b.size))}<span class="bar hide-sm"><i style="width:${(b.size / max) * 100}%"></i></span><span class="sub">${b.size.toLocaleString()} bytes</span></td><td title="${esc(absTime(b.modified))}">${esc(relTime(b.modified))}<span class="sub">${esc(absTime(b.modified))}</span></td><td>${restoreBtn(b)} <button class="sm" data-copy="${esc(b.name)}" title="Copy file name">Copy</button></td></tr>`).join("");
  const table = rows.length ? `<table><thead><tr>${head}<th class="nosort">Actions</th></tr></thead><tbody>${body}</tbody></table>` : `<div class="empty">${state.backups.length ? "No backups match." : token() ? "No backups found." : "Connect to see backups."}</div>`;
  $("list").innerHTML = table + `<div class="pager"><span class="muted">${all.length} result(s)</span><button data-p="-1" ${state.page <= 1 ? "disabled" : ""}>‹ Prev</button><span>Page ${state.page} / ${pages}</span><button data-p="1" ${state.page >= pages ? "disabled" : ""}>Next ›</button></div>`;
  renderHistory();
}

const loadHistory = () => readJson(HISTORY_KEY, []);
const pushHistory = (entry) => localStorage.setItem(HISTORY_KEY, JSON.stringify([entry, ...loadHistory()].slice(0, 10)));
function renderHistory() {
  const items = loadHistory();
  $("history").style.display = items.length ? "block" : "none";
  $("history").innerHTML = `<h3>Recent restores (this browser) <button class="sm" id="clearHistory">Clear</button></h3><table><tbody>${items.map((h) => `<tr><td>${h.success ? '<span class="badge healthy">ok</span>' : '<span class="badge down">failed</span>'}</td><td class="mono">${esc(h.backup)}</td><td>→ <b>${esc(h.database)}</b></td><td class="muted">${esc(fmtDuration(h.duration_ms || 0))}</td><td class="muted" title="${esc(new Date(h.at).toLocaleString())}">${esc(relTime(h.at / 1000))}</td></tr>`).join("")}</tbody></table>`;
}

// ---- restore dialog ----
const modalOpen = () => $("modalBg").classList.contains("open");
function closeModal() { if (state.restoring) return; $("modalBg").classList.remove("open"); }

function openRestore(name) {
  const b = state.backups.find((x) => x.name === name);
  if (!b) return;
  $("modal").innerHTML = `
    <h2>Restore backup <button id="mClose" title="Close">✕</button></h2>
    <dl><dt>Backup</dt><dd class="mono">${esc(b.name)}</dd><dt>Size</dt><dd>${esc(humanSize(b.size))}</dd><dt>Created</dt><dd>${esc(absTime(b.modified))} <span class="muted">(${esc(relTime(b.modified))})</span></dd></dl>
    <div class="warnbox"><b>⚠ This overwrites data.</b> The target database is replaced with the contents of this backup. It can take several minutes.</div>
    <div class="field"><label for="mDb">Target database</label><input id="mDb" class="mono" value="${esc(state.lastDb)}" autocomplete="off" spellcheck="false"><span class="hint" id="mDbHint">Letters, digits, <code>-</code> and <code>_</code>, up to 64 characters.</span></div>
    <div class="field"><label for="mConfirm">Type the database name again to confirm</label><input id="mConfirm" class="mono" autocomplete="off" spellcheck="false"><span class="hint bad" id="mConfirmHint"></span></div>
    <div class="actions"><button id="mCancel">Cancel</button><button id="mGo" class="danger" disabled>⤺ Restore</button></div>`;
  $("modalBg").classList.add("open");
  const check = () => {
    const db = $("mDb").value.trim(), conf = $("mConfirm").value.trim(), dbOk = DB_RE.test(db), match = dbOk && conf === db;
    $("mDb").className = "mono " + (db ? (dbOk ? "good" : "bad") : "");
    $("mDbHint").className = "hint" + (db && !dbOk ? " bad" : "");
    $("mConfirm").placeholder = dbOk ? db : "";
    $("mConfirm").className = "mono " + (conf ? (match ? "good" : "bad") : "");
    $("mConfirmHint").textContent = conf && !match ? "Does not match the target database." : "";
    $("mGo").disabled = !match || state.running;
    $("mGo").textContent = dbOk ? `⤺ Restore into ${db}` : "⤺ Restore";
  };
  $("mDb").oninput = check; $("mConfirm").oninput = check;
  $("mConfirm").onkeydown = (e) => { if (e.key === "Enter" && !$("mGo").disabled) $("mGo").click(); };
  $("mClose").onclick = closeModal; $("mCancel").onclick = closeModal;
  $("mGo").onclick = () => runRestore(b, $("mDb").value.trim());
  check();
  $("mConfirm").focus();
}

async function runRestore(b, database) {
  state.restoring = { backup: b.name, database, started: Date.now() };
  state.lastDb = database; savePrefs(); render();
  $("modal").innerHTML = `
    <h2>Restoring… <span class="muted" id="mElapsed">0s</span></h2>
    <p><span class="mono">${esc(b.name)}</span> → <b>${esc(database)}</b></p>
    <div class="progress"><i></i></div>
    <p class="muted">Keep this tab open to see the result. The restore keeps running on the server even if you leave.</p>`;
  const tick = setInterval(() => { const el = $("mElapsed"); if (el) el.textContent = fmtDuration(Date.now() - state.restoring.started); }, 1000);
  let r, err;
  try {
    r = await api(API_RESTORE, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ backup: b.name, database }) });
  } catch (e) { err = e; }
  clearInterval(tick);
  const duration = Date.now() - state.restoring.started;
  state.restoring = null;
  if (r) {
    pushHistory({ backup: r.backup, database: r.database, success: r.success, exit_code: r.exit_code, duration_ms: r.duration_ms, at: Date.now() });
    toast(r.success ? `Restored ${r.backup} into ${r.database}` : `Restore into ${r.database} failed (exit ${r.exit_code ?? "signal"})`, "", r.success);
  } else {
    toast("Restore request failed", err.message, false);
  }
  $("modal").innerHTML = `
    <h2>${r ? (r.success ? '<span class="badge healthy">Restore succeeded</span>' : '<span class="badge down">Restore failed</span>') : '<span class="badge down">Request failed</span>'} <button id="mClose" title="Close">✕</button></h2>
    <p><span class="mono">${esc(b.name)}</span> → <b>${esc(database)}</b> <span class="muted">· ${esc(fmtDuration(r ? r.duration_ms : duration))}${r ? ` · exit code ${esc(r.exit_code ?? "signal")}` : ""}</span></p>
    ${r ? `<h4 style="margin:12px 0 0">stdout</h4><pre class="mono">${esc(r.stdout || "(empty)")}</pre>${r.stderr ? `<h4 style="margin:12px 0 0">stderr</h4><pre class="mono">${esc(r.stderr)}</pre>` : ""}` : `<pre class="mono">${esc(err.message)}</pre>`}
    <div class="actions">${r ? '<button id="mCopy">Copy output</button>' : ""}<button id="mDone" class="primary">Close</button></div>`;
  $("mClose").onclick = closeModal; $("mDone").onclick = closeModal;
  if (r) $("mCopy").onclick = () => copy([r.stdout, r.stderr && "--- stderr ---\n" + r.stderr].filter(Boolean).join("\n"));
  await load();
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("Copied", "", true); }
  catch { toast("Copy failed", "Clipboard is not available on this page.", false); }
}

function setAuto() {
  clearInterval(state.timer);
  const on = $("auto").checked;
  $("liveDot").classList.toggle("live", on);
  state.timer = on ? setInterval(() => { if (!modalOpen()) load(); }, 60000) : null;
}
const applyLook = () => { document.documentElement.dataset.theme = state.theme; document.documentElement.dir = state.dir; };

function bind() {
  $("token").value = token();
  $("saveToken").onclick = () => { localStorage.setItem(TOKEN_KEY, $("token").value.trim()); load(); };
  $("token").onkeydown = (e) => { if (e.key === "Enter") $("saveToken").click(); };
  $("refresh").onclick = load;
  $("auto").onchange = setAuto;
  $("theme").onclick = () => { state.theme = state.theme === "dark" ? "light" : "dark"; applyLook(); savePrefs(); };
  $("dir").onclick = () => { state.dir = state.dir === "rtl" ? "ltr" : "rtl"; applyLook(); savePrefs(); };
  ["q", "fAge", "pageSize"].forEach((id) => $(id).addEventListener("input", () => { state.page = 1; render(); }));
  $("reset").onclick = () => { $("q").value = ""; $("fAge").value = ""; state.page = 1; render(); };
  $("list").onclick = (e) => {
    const rb = e.target.closest("[data-restore]"), cb = e.target.closest("[data-copy]");
    const th = e.target.closest("th[data-k]"), p = e.target.closest("[data-p]");
    if (rb) openRestore(rb.dataset.restore);
    else if (cb) copy(cb.dataset.copy);
    else if (th) { state.asc = state.sort === th.dataset.k ? !state.asc : th.dataset.k === "name"; state.sort = th.dataset.k; savePrefs(); render(); }
    else if (p) { state.page += +p.dataset.p; render(); }
  };
  $("history").onclick = (e) => { if (e.target.id === "clearHistory") { localStorage.removeItem(HISTORY_KEY); renderHistory(); } };
  $("modalBg").onclick = (e) => { if (e.target === $("modalBg")) closeModal(); };
  window.onbeforeunload = (e) => { if (state.restoring) { e.preventDefault(); e.returnValue = ""; } };
  document.onkeydown = (e) => {
    if (e.key === "Escape" && modalOpen()) closeModal();
    if (e.key === "/" && !["INPUT", "SELECT"].includes(document.activeElement.tagName) && !modalOpen()) { e.preventDefault(); $("q").focus(); }
  };
}

applyLook(); bind(); load();
</script>
</body>
</html>

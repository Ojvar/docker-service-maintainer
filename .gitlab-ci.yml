stages:
  - test
  - build

# Rust service (cargo). Tests run on every push and merge request;
# a release binary is built on main and kept as a job artifact.
default:
  tags:
    - qeng-docker
  image:
    name: docker.qeng.ir/rust:1-bookworm
    entrypoint: [""]
  interruptible: true

variables:
  GIT_STRATEGY: clone
  GIT_SUBMODULE_STRATEGY: none
  GIT_TERMINAL_PROMPT: "0"
  # Keep cargo's registry/git cache inside the project so it can be cached.
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  CARGO_TERM_COLOR: always

.cargo-cache: &cargo-cache
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - .cargo/registry/index
      - .cargo/registry/cache
      - .cargo/git/db
      - target/

.rust-checks: &rust-checks
  before_script:
    - set -Eeuo pipefail
    - |
      for FILE in Cargo.toml Cargo.lock; do
        if [ ! -f "$FILE" ]; then
          echo "ERROR: $FILE does not exist."
          exit 1
        fi
      done
    - rustc --version && cargo --version

test:
  stage: test
  <<: [*cargo-cache, *rust-checks]
  timeout: 30m
  script:
    - cargo test --locked --all-targets
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

build-release:
  stage: build
  <<: [*cargo-cache, *rust-checks]
  timeout: 30m
  script:
    - cargo build --release --locked
    - |
      mkdir -p dist
      cp target/release/service-maintainer dist/
      cp -r scripts templates .env.example README.md dist/
      ./dist/service-maintainer --version || true
  artifacts:
    name: "service-maintainer-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - when: never
